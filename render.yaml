services:
  - type: web
    name: skillsphere
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SKILLSPHERE_SECRET_KEY
        generateValue: true
      - key: SKILLSPHERE_PROCTORING_REQUIRED
        value: "true"
      - key: SKILLSPHERE_RECORDING_REQUIRED
        value: "false"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
